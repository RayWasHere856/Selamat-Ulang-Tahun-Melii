<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selamat Ulang Tahun Melii!</title>
    
    <!-- Mengambil font dari Google Fonts untuk tampilan surat -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Latar belakang gradasi pink/peach pastel yang lembut */
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container berbentuk seperti kartu surat */
        .card-container {
            background-color: #fffaf0; /* Warna kertas cream */
            width: 90%;
            max-width: 400px; /* Ukuran pas untuk iPhone 16 Pro Max */
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            /* Efek garis tepi putus-putus ala surat/perangko */
            border: 2px dashed #ffb6c1;
        }

        /* Ikon dekorasi animasi */
        .envelope-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        /* Gaya tulisan ucapan */
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: #d81b60;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .name {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            color: #ad1457;
            margin-bottom: 20px;
        }

        p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Tombol lanjut */
        .btn-lanjut {
            display: inline-block;
            background-color: #d81b60;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            font-weight: 600;
            border-radius: 25px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
        }

        /* Efek saat tombol ditekan (khusus mobile) atau di-hover */
        .btn-lanjut:active, .btn-lanjut:hover {
            background-color: #ad1457;
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(173, 20, 87, 0.3);
        }

        /* Animasi mengambang untuk ikon surat */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="envelope-icon">💌</div>
        <h1>selamat ulang tahun</h1>
        <div class="name">Melii(Mei Yan) <br>(Kak Ros Galak)</div>
        <p>Nih kado dari aku. walau cuma dari web tapi aku buatin spesial buat kamu.</p>
        
        <!-- Mengarahkan ke halaman ucapan.html -->
        <a href="ucapan.html" class="btn-lanjut">Buka Surat ➔</a>
    </div>

</body>
</html>
